<html lang="uz">

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#29213e,#0b101b 55%,#070a12);
}
header{
 text-align:center;padding:25px 10px;
 background:linear-gradient(180deg,#211c32,#111522);
 border-bottom:2px solid #d5a52b;
}
h1{color:#f4ce6b;margin:0;font-size:24px}
header p{color:#aaa;font-size:12px}
nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}
button{
 border:1px solid #b98b2c;
 background:linear-gradient(145deg,#25243a,#111827);
 color:#f4ce6b;padding:13px;border-radius:10px;
 font-weight:bold;font-size:14px;cursor:pointer;
}
button:active{opacity:.7}
#content{padding:15px;max-width:650px;margin:auto}
h2{color:#f4ce6b}
.notice{
 background:#382c14;color:#ffdc82;padding:12px;
 border-radius:9px;font-size:12px;margin:12px 0;
 border:1px solid #8c6925;
}
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.game-card{padding:0;overflow:hidden;width:100%}
.game-card img{width:100%;height:150px;object-fit:cover;display:block}
.game-card span{display:block;padding:14px 5px}
.card{
 background:linear-gradient(145deg,#1c2335,#101725);
 border:1px solid #66512b;padding:15px;
 border-radius:12px;margin:12px 0;
}
input,textarea,select{
 width:100%;padding:12px;margin:7px 0;border-radius:8px;
 border:1px solid #8c6925;background:#101827;color:white;
 font-size:14px;
}
textarea{min-height:85px;resize:vertical}
input[type=file]{background:#171f30}
.back{width:100%;margin-top:12px}
.price{color:#f4ce6b;font-size:20px;font-weight:bold}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.preview img{width:100%;height:100px;object-fit:cover;border-radius:8px;border:1px solid #b98b2c}
.small{font-size:12px;color:#aaa}
.listing-img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}
</style>
</head>

<body>

</header>

<button onclick="show('profile')" id="nProfile">👤 PROFIL</button>
<button onclick="show('language')" id="nLanguage">🌐 TIL</button>
<button onclick="show('help')" id="nHelp">🛡️ YORDAM</button>

<div id="content"></div>

level:"Аккаунт деңгээли",skins:"Скиндер жана буюмдар жөнүндө маалымат",
price:"Баасы (сум)",photos:"Аккаунт сүрөттөрү (1–12)",

helpText:"Жардам керекпи? Администраторго кайрылыңыз.",

listing:"Жарнама маалыматы",noListings:"Азырынча үлгү аккаунттар жок.",

}
};

let lang=localStorage.getItem("egm_lang")||"uz";
function t(key){return translations[lang][key]||translations.uz[key]||key;}

const games={
pubg:{
name:"PUBG MOBILE",
image:"https://images.igdb.com/sc69jb.jpg",
emoji:"🎮"
},
ff:{
name:"FREE FIRE",
image:"https://cdn.wildflamestudio.com/common/web_event/official2.ff.garena.all/202210/82fe305f7dbb9f25e68996f8f719e576.jpg",
emoji:"🔥"
}
};

function gameButtons(action){
return `<div class="game-grid">
<button class="game-card" onclick="${action}('pubg')">
<img src="${games.pubg.image}" alt="PUBG MOBILE" onerror="this.style.display='none'">
<span>🎮 PUBG MOBILE</span>
</button>
<button class="game-card" onclick="${action}('ff')">
<img src="${games.ff.image}" alt="FREE FIRE" onerror="this.style.display='none'">
<span>🔥 FREE FIRE</span>
</button>
</div>`;
}

function home(){
content.innerHTML=`
<div class="notice">${t("demo")}</div>
<h2>🎮 ${t("choose")}</h2>
${gameButtons("catalog")}
`;
}

function updateMenu(){
document.getElementById("nBuy").textContent="🛒 "+t("buy");
document.getElementById("nSell").textContent="💰 "+t("sell");
document.getElementById("nPremium").textContent="⭐ "+t("premium");
document.getElementById("nProfile").textContent="👤 "+t("profile");
document.getElementById("nLanguage").textContent="🌐 "+t("language");
document.getElementById("nHelp").textContent="🛡️ "+t("help");
}

function show(key){
if(key==="buy")home();

if(key==="sell"){
content.innerHTML=`
<h2>💰 ${t("sell")}</h2>
<div class="notice">${t("demo")}</div>
<h3>${t("chooseGame")}</h3>
${gameButtons("sellForm")}
<button class="back" onclick="home()">${t("back")}</button>`;
}

if(key==="premium"){
content.innerHTML=`<h2>⭐ ${t("premium")}</h2><div class="card">${t("premiumSoon")}</div><button class="back" onclick="home()">${t("back")}</button>`;
}

if(key==="profile"){
content.innerHTML=`<h2>👤 ${t("profile")}</h2><div class="card">${t("demoProfile")}</div><button class="back" onclick="home()">${t("back")}</button>`;
}

if(key==="language"){
content.innerHTML=`
<h2>🌐 ${t("languageTitle")}</h2>
${[
["uz","🇺🇿 O‘zbekcha"],["ru","🇷🇺 Русский"],
["en","🇬🇧 English"],["tg","🇹🇯 Тоҷикӣ"],
["kk","🇰🇿 Қазақша"],["ky","🇰🇬 Кыргызча"]
].map(x=>`<button style="width:100%;margin:5px 0" onclick="setLang('${x[0]}')">${x[1]}</button>`).join("")}
<button class="back" onclick="home()">${t("back")}</button>`;
}

if(key==="help"){
content.innerHTML=`
<h2>🛡️ ${t("help")}</h2>
<div class="card">${t("helpText")}</div>
<button onclick="openAdmin()">${t("admin")}</button>
<button class="back" onclick="home()">${t("back")}</button>`;
}
}

function setLang(value){
lang=value;
localStorage.setItem("egm_lang",value);
updateMenu();
home();
}

function sellForm(id){
selectedGame=id;
const game=games[id];
content.innerHTML=`
<h2>${game.emoji} ${game.name}</h2>
<div class="notice">${t("demo")}</div>
<h3>${t("listing")}</h3>
<input id="accountName" placeholder="${t("accountName")}">
<input id="accountLevel" placeholder="${t("level")}">
<textarea id="skins" placeholder="${t("skins")}"></textarea>
<input id="accountPrice" type="number" min="0" placeholder="${t("price")}">
<label>${t("photos")}</label>
<input id="photos" type="file" accept="image/*" multiple>
<p class="small">1–12 ta rasm tanlang. Rasmlar faqat ushbu sahifada ko‘rinadi.</p>
<div id="photoPreview" class="preview"></div>
<button onclick="previewListing()">${t("submit")}</button>
<button class="back" onclick="show('sell')">${t("back")}</button>`;

document.getElementById("photos").addEventListener("change",previewPhotos);
}

function previewPhotos(){
const files=[...document.getElementById("photos").files];
const area=document.getElementById("photoPreview");
if(files.length>12){
alert(t("tooMany"));
document.getElementById("photos").value="";
area.innerHTML="";
return;
}
area.innerHTML="";
files.forEach(file=>{
const img=document.createElement("img");
img.src=URL.createObjectURL(file);
area.appendChild(img);
});
}

function previewListing(){
const name=document.getElementById("accountName").value.trim();
const level=document.getElementById("accountLevel").value.trim();
const skins=document.getElementById("skins").value.trim();
const price=document.getElementById("accountPrice").value.trim();
const files=[...document.getElementById("photos").files];

if(!name||!level||!skins||!price||files.length===0){
alert(t("required"));return;
}
if(files.length>12){alert(t("tooMany"));return;}

content.innerHTML=`
<h2>✅ ${t("submit")}</h2>
<div class="notice">${t("demo")} E’lon saqlanmadi va joylanmadi.</div>
<div class="card">
<h3>${games[selectedGame].name}</h3>
<p><b>${t("accountName")}:</b> ${escapeHTML(name)}</p>
<p><b>${t("level")}:</b> ${escapeHTML(level)}</p>
<p><b>${t("skins")}:</b> ${escapeHTML(skins)}</p>
<p class="price">${escapeHTML(price)} so‘m</p>
<div class="preview" id="finalPhotos"></div>
</div>
<button class="back" onclick="home()">${t("home")}</button>
<button class="back" onclick="sellForm('${selectedGame}')">${t("back")}</button>`;

const area=document.getElementById("finalPhotos");
files.forEach(file=>{
const img=document.createElement("img");
img.src=URL.createObjectURL(file);
area.appendChild(img);
});
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function catalog(id){
const game=games[id];
content.innerHTML=`
<h2>${game.emoji} ${game.name} — ${t("catalog")}</h2>
<div class="notice">${t("demo")}</div>
<div class="card">
<h3>${game.name} — DEMO 01</h3>
<p>${t("sample")}</p>
<p class="price">50 000 so‘m</p>
</div>
<div class="card">
<h3>${game.name} — DEMO 02</h3>
<p>${t("sample")}</p>
<p class="price">80 000 so‘m</p>
</div>
<button class="back" onclick="home()">${t("back")}</button>`;
}

function openAdmin(){
const url="https://t.me/toliboevv";
if(window.Telegram&&window.Telegram.WebApp){
window.Telegram.WebApp.openTelegramLink(url);
}else{
window.open(url,"_blank");
}
}

updateMenu();
home();
</script>
